name: check

# 30분마다, 24시간. 종일 실행이라 UTC/KST 변환이 필요 없다 —
# 시간대 제한을 두면 KST→UTC 변환에서 요일이 밀리는 실수가 생긴다.
#
# :13/:43 인 이유는 혼잡 회피다. GitHub 은 부하가 높을 때 스케줄을 미루거나
# 거르는데 정각·30분은 전 세계 워크플로가 몰리는 시각이라 가장 심하다.
# 실제로 */30 으로 두었을 때 11:30Z 와 12:00Z 두 슬롯이 연속으로 건너뛰었다.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

# 실행이 겹치면 두 프로세스가 같은 SQLite 를 쓰고 push 가 충돌한다.
# 진행 중인 실행을 죽이지는 않는다 — 알림을 보내는 중일 수 있다.
concurrency:
  group: cuk-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 새 공지 수집 및 알림
        env:
          # Vertex first, AI Studio behind it. If Vertex stops working the
          # free tier takes over rather than the bot quietly forwarding
          # everything unjudged.
          CUK_VERTEX_CREDENTIALS_JSON: ${{ secrets.CUK_VERTEX_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUK_HEALTHCHECK_URL: ${{ secrets.CUK_HEALTHCHECK_URL }}
        run: python -m cuk_bot --check

      - name: 상태 저장 (DB 커밋)
        # 상태가 사라지면 다음 실행이 모든 공지를 새 글로 보고 알림 폭탄을 낸다.
        # 커밋이 쌓이는 부수 효과로 레포가 활성 상태로 유지되는데, GitHub 이
        # 60일 무활동 시 스케줄 워크플로를 조용히 끄기 때문에 이게 중요하다.
        run: |
          git config user.name "cuk-notice-bot"
          git config user.email "noreply@users.noreply.github.com"
          # -f because .gitignore blanket-ignores *.db; staging first is what
          # makes this work on the very first run, when the file is still
          # untracked and `git diff` would report no change forever.
          git add -f cuk_notices.db
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(state): 수집 결과 반영 [skip ci]"
          git push || {
            echo "push 충돌 — rebase 후 1회 재시도"
            git pull --rebase --autostash
            git push
          }
